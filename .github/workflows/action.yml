name: action
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          config: examples/config.yaml
      - name: An invalid config must fail the action
        id: bad
        continue-on-error: true
        uses: ./
        with:
          config: tests/action/missing.yaml
      - run: test "${{ steps.bad.outcome }}" = failure
  serve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start two backends
        run: |
          mkdir -p b1 b2 && echo one > b1/index.html && echo two > b2/index.html
          (cd b1 && python3 -m http.server 8081 --bind 127.0.0.1 &) ; (cd b2 && python3 -m http.server 8082 --bind 127.0.0.1 &)
      - uses: ./
        id: lb
        with:
          config: tests/action/config.yaml
          mode: serve
          workers: "2"
      - name: Traffic goes through the load balancer to both backends
        run: |
          for i in $(seq 30); do
            [ "$(curl -s "${{ steps.lb.outputs.admin-url }}/target-groups/app" | python3 -c 'import json,sys; print(sum(t["routable"] for t in json.load(sys.stdin)["status"]["targets"]))')" = 2 ] && break
            sleep 1
          done
          seen=$(for i in $(seq 20); do curl -s localhost:8080/; done | sort -u | tr '\n' ' ')
          echo "backends seen: $seen"
          test "$seen" = "one two "
      - if: always()
        run: cat "${{ steps.lb.outputs.log }}" | tail -20

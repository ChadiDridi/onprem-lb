name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ matrix.python }} && uv pip install -e '.[dev,fast]'
      - run: .venv/bin/ruff check src tests && .venv/bin/ruff format --check src tests
      - run: .venv/bin/pytest -v
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t onprem-lb:ci .
      - name: Smoke test the image
        run: |
          printf 'admin: {listen: 127.0.0.1:9900}\nload_balancers:\n  x: {type: application, listeners: [{port: 8080, protocol: http, default_action: {fixed_response: {status: 200, body: ok}}}]}\n' > /tmp/lb.yaml
          docker run -d --name lb --network host -v /tmp/lb.yaml:/etc/onprem-lb/config.yaml:ro onprem-lb:ci serve -c /etc/onprem-lb/config.yaml --workers 2
          for i in $(seq 30); do curl -sf localhost:8080 && break; sleep 1; done
          test "$(curl -s localhost:8080)" = ok
          docker logs lb

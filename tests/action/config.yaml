# Used by .github/workflows/action.yml to test the GitHub Action.
admin:
  listen: 127.0.0.1:9900
target_groups:
  app:
    protocol: http
    algorithm: round_robin
    targets: [127.0.0.1:8081, 127.0.0.1:8082]
    health_check: {path: /, interval: 1}
load_balancers:
  web:
    type: application
    listeners:
      - port: 8080
        bind: 127.0.0.1
        protocol: http
        default_action: {forward: app}
